# Eglantine for Steam Deck: the settings the fork is developed and measured with.
#
# Load it with `-c /path/to/eglantine-deck.ini` (eglantine-deck.sh does this). Only the
# settings that differ from eden-cli's defaults are listed; every other setting keeps its
# default. The emulator writes the complete file back on exit, which is fine.
#
# Each setting is two lines: `name\default=false` tells the emulator to read the value on the
# next line at all; without it the value is ignored.


[Renderer]

# 1x of the game's own render resolution. Switch 2 games already render below the Deck's
# 1280x800 in handheld mode; anything above 1x is GPU time the Deck does not have.
resolution_setup\default=false
resolution_setup=2

# GPU accuracy "Normal" (the default is High). High re-checks memory the GPU wrote on every
# access; the fork's own fences keep the two Switch 2 titles correct at Normal.
gpu_accuracy\default=false
gpu_accuracy=0

# Recompress GPU-decoded ASTC textures to BC3. The Deck's 16 GB is shared with the GPU and
# Mario Kart World keeps ~1 GB of ASTC resident; uncompressed, that is 4x the memory.
astc_recompression\default=true
astc_recompression=2

# Build shaders on a second thread instead of stalling the frame on each new one. Objects can
# pop in a few frames late the first time a shader is met; the stutter is much smaller.
use_asynchronous_shaders\default=false
use_asynchronous_shaders=true
